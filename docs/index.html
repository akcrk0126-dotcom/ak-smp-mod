<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AK SMP 접속 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow column of 4 numbered steps, each a block with its own action button; language switch top-right. */
:root{
  --bg:#eef1ea; --panel:#ffffff; --ink:#1d2419; --muted:#5d6a57; --line:#d5dccf;
  --grass:#3f8f2a; --grass-ink:#ffffff; --dirt:#7a5533; --code:#f3f5ef;
  --display:"Silkscreen","Noto Sans KR",ui-monospace,monospace;
  --body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141812; --panel:#1c2219; --ink:#e7ecdf; --muted:#9aa892; --line:#2f3829;
  --grass:#5cb53c; --grass-ink:#0c1209; --dirt:#b88559; --code:#11150f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --panel:#1c2219; --ink:#e7ecdf; --muted:#9aa892; --line:#2f3829;
  --grass:#5cb53c; --grass-ink:#0c1209; --dirt:#b88559; --code:#11150f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:700 clamp(28px,7vw,40px)/1.05 var(--display);margin:0;letter-spacing:.5px}
h1 small{display:block;font:600 15px/1.4 var(--body);color:var(--muted);margin-top:8px;letter-spacing:0}
.lang{display:flex;border:2px solid var(--ink);flex:none}
.lang button{font:700 13px var(--display);background:transparent;color:var(--ink);border:0;padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{background:var(--panel);border:2px solid var(--line);padding:12px 14px;font-size:15px}
.step{background:var(--panel);border:2px solid var(--line);border-bottom:6px solid var(--dirt);padding:18px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px}
.num{grid-row:span 2;width:44px;height:44px;display:grid;place-items:center;background:var(--grass);color:var(--grass-ink);font:700 22px var(--display)}
.step h2{margin:0;font:800 19px/1.3 var(--body);align-self:center}
.body{min-width:0;display:flex;flex-direction:column;gap:10px}
.body p{margin:0}
ol{margin:0;padding-left:20px}
li{margin:2px 0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:700 15px var(--body);background:var(--grass);color:var(--grass-ink);padding:11px 16px;border:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.copy:focus-visible,.lang button:focus-visible{outline:3px solid var(--dirt);outline-offset:2px}
.btn .f{font:400 12px var(--display);opacity:.85}
.copyrow{display:flex;align-items:stretch;border:2px solid var(--line);background:var(--code);min-width:0}
.copyrow code{flex:1;min-width:0;padding:9px 12px;font:600 15px ui-monospace,Consolas,monospace;overflow-x:auto;white-space:nowrap}
.copy{border:0;border-left:2px solid var(--line);background:transparent;color:var(--ink);font:700 13px var(--body);padding:0 14px;cursor:pointer;flex:none}
.copy.done{color:var(--grass)}
b.k{font-weight:800}
.warn{color:var(--dirt);font-weight:600;font-size:14px}
details{background:var(--panel);border:2px solid var(--line);padding:12px 14px}
summary{font-weight:800;cursor:pointer}
details ul{margin:8px 0 0;padding-left:20px}
footer{color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.step{grid-template-columns:1fr}.num{grid-row:auto}}
</style>

<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AK SMP<small data-ko="모드 깔고 들어오는 법 · 5분" data-en="Install the mod and join · 5 min"></small></h1>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-ko" type="button" aria-pressed="true">한국어</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <p class="note" data-ko="일반 마크로는 못 들어와. 아래 4단계를 순서대로 한 번만 하면 돼. (윈도우 · Minecraft Java 26.3)" data-en="Vanilla Minecraft can't join. Do these 4 steps once, in order. (Windows · Minecraft Java 26.3)"></p>

  <section class="step">
    <div class="num">1</div>
    <h2 data-ko="Fabric 설치" data-en="Install Fabric"></h2>
    <div class="body">
      <div class="btns"><a class="btn" href="https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.exe" target="_blank" rel="noopener"><span data-ko="Fabric 설치 프로그램 받기" data-en="Download Fabric installer"></span><span class="f">.exe</span></a></div>
      <ol>
        <li data-ko="마크 런처를 <b class='k'>끄고</b> 받은 파일 실행" data-en="<b class='k'>Close</b> the Minecraft Launcher, then run the file"></li>
        <li data-ko="<b class='k'>Client</b> 탭 → Minecraft Version <b class='k'>26.3</b> → <b class='k'>Install</b>" data-en="<b class='k'>Client</b> tab → Minecraft Version <b class='k'>26.3</b> → <b class='k'>Install</b>"></li>
      </ol>
      <p class="warn" data-ko="26.3이 목록에 없으면 런처에서 최신 릴리스로 한 번 켰다 끄고 다시 해." data-en="No 26.3 in the list? Launch Latest Release once in the launcher, close it, then try again."></p>
    </div>
  </section>

  <section class="step">
    <div class="num">2</div>
    <h2 data-ko="모드 파일 2개 넣기" data-en="Add the 2 mod files"></h2>
    <div class="body">
      <div class="btns">
        <a class="btn" href="https://github.com/akcrk0126-dotcom/ak-smp-mod/releases/latest/download/ak-smp.jar" target="_blank" rel="noopener">AK SMP <span class="f">ak-smp.jar</span></a>
        <a class="btn" href="https://github.com/akcrk0126-dotcom/ak-smp-mod/releases/latest/download/fabric-api.jar" target="_blank" rel="noopener">Fabric API <span class="f">fabric-api.jar</span></a>
      </div>
      <ol>
        <li data-ko="키보드 <b class='k'>Win + R</b> → 아래 주소 붙여넣기 → 엔터" data-en="Press <b class='k'>Win + R</b> → paste the path below → Enter"></li>
      </ol>
      <div class="copyrow"><code id="path">%appdata%\.minecraft\mods</code><button class="copy" type="button" id="copy-path" data-target="path" data-ko="복사" data-en="Copy"></button></div>
      <ol start="2">
        <li data-ko="열린 폴더에 받은 <b class='k'>.jar 2개</b>를 그대로 넣기 (압축 풀지 말기)" data-en="Drop both <b class='k'>.jar files</b> into that folder (don't unzip)"></li>
      </ol>
      <p class="warn" data-ko="폴더가 없다고 나오면 .minecraft 안에 mods 폴더를 새로 만들어. 예전 ak-smp-1.x.jar가 있으면 지워." data-en="Folder not found? Create a mods folder inside .minecraft. Delete any old ak-smp-1.x.jar."></p>
    </div>
  </section>

  <section class="step">
    <div class="num">3</div>
    <h2 data-ko="런처에서 Fabric 고르기" data-en="Pick Fabric in the launcher"></h2>
    <div class="body">
      <ol>
        <li data-ko="런처 <b class='k'>설치 설정</b> → <b class='k'>fabric-loader-26.3</b> → ⋯ → <b class='k'>편집</b>" data-en="Launcher <b class='k'>Installations</b> → <b class='k'>fabric-loader-26.3</b> → ⋯ → <b class='k'>Edit</b>"></li>
        <li data-ko="<b class='k'>버전</b>: 목록 <b class='k'>맨 위</b>쪽 <b class='k'>release fabric-loader-…-26.3</b> (최신 릴리스 아님!)" data-en="<b class='k'>Version</b>: near the <b class='k'>top</b> of the list, <b class='k'>release fabric-loader-…-26.3</b> (not Latest Release!)"></li>
        <li data-ko="<b class='k'>게임 디렉터리</b> 옆 <b class='k'>X</b> 눌러서 비우기 → <b class='k'>저장</b>" data-en="Click the <b class='k'>X</b> next to <b class='k'>Game directory</b> to clear it → <b class='k'>Save</b>"></li>
        <li data-ko="플레이 → 마크 화면 왼쪽 아래에 <b class='k'>fabric</b> 글자가 보이면 성공" data-en="Play → if the bottom-left of the title screen says <b class='k'>fabric</b>, you're set"></li>
      </ol>
    </div>
  </section>

  <section class="step">
    <div class="num">4</div>
    <h2 data-ko="서버 접속" data-en="Join the server"></h2>
    <div class="body">
      <p data-ko="멀티플레이 → 서버 추가 → 주소:" data-en="Multiplayer → Add Server → address:"></p>
      <div class="copyrow"><code id="addr">megag7smp.minehut.gg</code><button class="copy" type="button" id="copy-addr" data-target="addr" data-ko="복사" data-en="Copy"></button></div>
      <p class="warn" data-ko="서버가 자고 있으면 깨어나는 데 30초~1분 걸려." data-en="If the server is asleep it takes 30s–1 min to wake up."></p>
    </div>
  </section>

  <details>
    <summary data-ko="안 될 때" data-en="Not working?"></summary>
    <ul>
      <li data-ko="<b class='k'>requires Fabric Loader and Fabric API</b> 뜨며 튕김 → 3단계 다시 (버전이 fabric-loader인지, 게임 디렉터리 비웠는지)" data-en="Kicked with <b class='k'>requires Fabric Loader and Fabric API</b> → redo step 3 (Version must be fabric-loader, Game directory cleared)"></li>
      <li data-ko="버전 목록에 fabric-loader가 없음 → 런처 끄고 1단계 다시" data-en="No fabric-loader in the Version list → close the launcher and redo step 1"></li>
      <li data-ko="마크가 켜지다 오류 → mods 폴더에 파일 2개만 있는지 확인 (같은 모드 2개면 안 됨)" data-en="Game crashes on start → make sure the mods folder has just these 2 files (no duplicates)"></li>
      <li data-ko="영어로 보고 싶음 → 마크 설정 → 언어 → English. 서버 메뉴·채팅도 같이 바뀜" data-en="Want English? Options → Language → English. Server menus and chat switch too"></li>
    </ul>
  </details>

  <footer data-ko="모드가 업데이트되면 2단계의 AK SMP 파일만 다시 받아서 바꿔 넣으면 돼." data-en="When the mod updates, just download the AK SMP file in step 2 again and replace the old one."></footer>
</div>

<script>
(function(){
  var lang = 'ko';
  try { var s = localStorage.getItem('aksmp-lang'); if (s) lang = s; else if (!/^ko/i.test(navigator.language || '')) lang = 'en'; } catch (e) { if (!/^ko/i.test(navigator.language || '')) lang = 'en'; }
  function apply(l){
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-ko]').forEach(function(el){ el.innerHTML = el.getAttribute('data-' + l); });
    document.getElementById('lang-ko').setAttribute('aria-pressed', l === 'ko');
    document.getElementById('lang-en').setAttribute('aria-pressed', l === 'en');
    try { localStorage.setItem('aksmp-lang', l); } catch (e) {}
  }
  document.getElementById('lang-ko').addEventListener('click', function(){ apply('ko'); });
  document.getElementById('lang-en').addEventListener('click', function(){ apply('en'); });
  document.querySelectorAll('.copy').forEach(function(b){
    b.addEventListener('click', function(){
      var code = document.getElementById(b.getAttribute('data-target'));
      var done = function(){ b.textContent = lang === 'ko' ? '복사됨' : 'Copied'; b.classList.add('done'); setTimeout(function(){ b.textContent = b.getAttribute('data-' + lang); b.classList.remove('done'); }, 1500); };
      var select = function(){ var r = document.createRange(); r.selectNodeContents(code); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      try { navigator.clipboard.writeText(code.textContent).then(done, select); } catch (e) { select(); }
    });
  });
  apply(lang);
})();
</script>

</body>
</html>
